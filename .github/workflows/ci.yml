name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_CONFIGURATION: Release
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/Web/package-lock.json
      - name: Build and component tests
        working-directory: src/Web
        run: npm ci --no-audit --no-fund && npm run build && npm test
      - run: dotnet restore TeamsReference.slnx --locked-mode
      - run: dotnet test TeamsReference.slnx --configuration Release --no-restore --logger trx
      - name: Azure protocol and primary-read contracts
        run: node --test tests/Scripts/primary-read.test.mjs tests/Scripts/pubsub-waf.test.mjs
      - name: Browser prerequisites
        working-directory: src/Web
        run: npx playwright install --with-deps chromium
      - name: Web App scenarios
        working-directory: src/Web
        run: npm run check:entra && npm run test:entra:unit && npm run test:e2e
      - name: Compile Bicep
        run: |
          az bicep install --version v0.48.1
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
          az bicep build --file infra/subscription.bicep --outfile "$RUNNER_TEMP/subscription.json"
          az bicep build --file infra/live.bicep --outfile "$RUNNER_TEMP/live.json"
          az bicep build --file infra/synthetic-live.bicep --outfile "$RUNNER_TEMP/synthetic-live.json"
          az bicep build --file infra/service-dev-identities.bicep --outfile "$RUNNER_TEMP/service-dev-identities.json"
          az bicep build --file infra/service-dev.bicep --outfile "$RUNNER_TEMP/service-dev.json"
          az bicep build --file infra/service-dev-bus.bicep --outfile "$RUNNER_TEMP/service-dev-bus.json"
          az bicep build --file infra/service-dev-access.bicep --outfile "$RUNNER_TEMP/service-dev-access.json"
          az bicep build --file infra/service-dev-edge.bicep --outfile "$RUNNER_TEMP/service-dev-edge.json"
      - name: Verify management scripts
        shell: pwsh
        run: |
          ./scripts/Check-Scripts.ps1
          ./tests/Scripts/EntraBootstrap.Tests.ps1
          ./tests/Scripts/SignInConsent.Tests.ps1
          ./tests/Scripts/IdentityProfile.Tests.ps1
          ./tests/Scripts/LiveDeployment.Tests.ps1
          ./tests/Scripts/DeploymentContract.Tests.ps1
          ./tests/Scripts/DevDeployment.Tests.ps1
          ./tests/Scripts/ServiceDev.Tests.ps1
          ./tests/Scripts/LiveOnly.Tests.ps1
          ./tests/Scripts/LiveSetup.Tests.ps1
      - name: Correctness artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: correctness
          retention-days: 7
          path: |
            tests/Teams.Tests/TestResults/*.trx
            src/Web/test-results/**/*.png
