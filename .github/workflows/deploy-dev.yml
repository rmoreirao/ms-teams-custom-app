name: Deploy dev
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter DEPLOY-DEV for an image-only release to the reviewed existing Development targets."
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME }}
      AZURE_API_APP_NAME: ${{ vars.AZURE_API_APP_NAME }}
      AZURE_WORKER_APP_NAME: ${{ vars.AZURE_WORKER_APP_NAME }}
      AZURE_CONTAINER_APP_ENVIRONMENT_ID: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT_ID }}
      AZURE_SERVICE_TARGETS_JSON: ${{ vars.AZURE_SERVICE_TARGETS_JSON }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require existing protected Live Development targets
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY-DEV" || { echo "Explicit DEPLOY-DEV acknowledgement is required."; exit 1; }
          for name in AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_RESOURCE_GROUP AZURE_REGISTRY_NAME AZURE_CONTAINER_APP_ENVIRONMENT_ID DEPLOY_CLIENT_ID; do
            test -n "${!name}" || { echo "Missing protected Development variable: $name"; exit 1; }
          done
          if test -z "$AZURE_SERVICE_TARGETS_JSON"; then
            test -n "$AZURE_API_APP_NAME" && test -n "$AZURE_WORKER_APP_NAME" || { echo "Missing legacy targets before the approved service cutover."; exit 1; }
          fi
          # Environment reviewers and existing OIDC/RBAC are external prerequisites; this job grants nothing.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
      - name: Verify release source
        run: |
          set -euo pipefail
          dotnet restore TeamsReference.slnx --locked-mode
          dotnet test TeamsReference.slnx --configuration Release --no-restore
          cd src/Web
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: Verify release safety contracts offline
        shell: pwsh
        run: |
          ./tests/Scripts/DeploymentContract.Tests.ps1
          ./tests/Scripts/DevDeployment.Tests.ps1
          ./tests/Scripts/ServiceDev.Tests.ps1
      - uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build immutable container
        id: image
        shell: bash
        run: |
          set -euo pipefail
          server="$(az acr show --subscription "$AZURE_SUBSCRIPTION_ID" --name "$AZURE_REGISTRY_NAME" --query loginServer -o tsv)"
          test "$server" = "$AZURE_REGISTRY_NAME.azurecr.io" || { echo "Unexpected registry."; exit 1; }
          az acr login --subscription "$AZURE_SUBSCRIPTION_ID" --name "$AZURE_REGISTRY_NAME"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$server/teams-reference:$GITHUB_SHA" .
          docker push "$server/teams-reference:$GITHUB_SHA"
          digest="$(az acr repository show --subscription "$AZURE_SUBSCRIPTION_ID" --name "$AZURE_REGISTRY_NAME" --image "teams-reference:$GITHUB_SHA" --query digest -o tsv)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "An immutable image digest is required."; exit 1; }
          echo "reference=$server/teams-reference@$digest" >> "$GITHUB_OUTPUT"
      - name: Preflight and release existing Live images
        shell: pwsh
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $legacyArguments = @{
            SubscriptionId = $env:AZURE_SUBSCRIPTION_ID
            TenantId = $env:AZURE_TENANT_ID
            ResourceGroup = $env:AZURE_RESOURCE_GROUP
            RegistryName = $env:AZURE_REGISTRY_NAME
            ApiAppName = $env:AZURE_API_APP_NAME
            WorkerAppName = $env:AZURE_WORKER_APP_NAME
            EnvironmentId = $env:AZURE_CONTAINER_APP_ENVIRONMENT_ID
            Image = $env:IMAGE_REFERENCE
          }
          $targetFile = $null
          if ($env:AZURE_SERVICE_TARGETS_JSON) {
            $targets = $env:AZURE_SERVICE_TARGETS_JSON | ConvertFrom-Json -Depth 100
            if ($targets.subscriptionId -ne $env:AZURE_SUBSCRIPTION_ID -or $targets.tenantId -ne $env:AZURE_TENANT_ID -or
                $targets.resourceGroup -ne $env:AZURE_RESOURCE_GROUP -or $targets.environmentId -ne $env:AZURE_CONTAINER_APP_ENVIRONMENT_ID) {
              throw 'Service targets differ from the protected Development environment.'
            }
            $targetFile = Join-Path $env:RUNNER_TEMP 'service-targets.json'
            $env:AZURE_SERVICE_TARGETS_JSON | Set-Content -LiteralPath $targetFile -Encoding utf8
            $releaseScript = './scripts/Deploy-ServiceDev.ps1'
            $arguments = @{ TargetsPath=$targetFile; RegistryName=$env:AZURE_REGISTRY_NAME; Image=$env:IMAGE_REFERENCE }
          } else {
            $releaseScript = './scripts/Deploy-Dev.ps1'
            $arguments = $legacyArguments
          }
          # Only image/revision identities are retained; never publish environment or secret snapshots.
          try {
            & $releaseScript @arguments
            & $releaseScript @arguments -Apply -Confirmation $env:CONFIRMATION -Confirm:$false |
              ForEach-Object {
                $_
                if ($_ -is [string] -and $_ -match '^(Recovery:|Verified:|Recovery requires)') {
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $_
                }
              }
          } finally {
            if ($targetFile) { Remove-Item -LiteralPath $targetFile -Force }
          }
