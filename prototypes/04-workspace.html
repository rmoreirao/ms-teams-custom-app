<!doctype html>
<html lang="en">
<!--
THESIS: Organize by team; explore simplicity through structure, not decoration.
OWN-WORLD: Segoe UI, Clawpilot neutral surfaces, restrained rose accent, clear borders.
STORY: Find a chat or channel, read context, send a demo message, and reply.
FIRST VIEWPORT: A clear home for every conversation. The composer is the primary action.
FORM: Team/channel outline beside a post-based feed with inline replies. User-approved four-concept exploration; no production winner.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Workspace: a standalone, interactive messaging UI prototype with fictional sample data.">
  <title>Workspace - Messaging prototypes</title>
  <script>(() => {
    const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();</script>
  <style>

  --cp-bg: #3d3b3a;

  --cp-success: #4ade80;

    }
    document.querySelectorAll(".messages").forEach(element => {
      element.scrollTop = scrollToBottom === "start" ? 0 : scrollToBottom ? element.scrollHeight : scrolls[element.id] || 0;
    });
  }
  function updateControls() {
    document.getElementById("view-state").value = state.view;
    document.getElementById("send-outcome").value = state.nextOutcome;
    document.getElementById("connection-control").textContent = state.online ? "Simulate offline" : "Reconnect demo";
    updateTheme();
  }
  function selectConversation(id) {
    state.selected = id;
    state.thread = null;
    state.reading = true;
    state.mobileReading = true;
    state.navigationOpen = false;
    render(current().kind === "channel" ? "start" : true);
    focus("conversation-title");
    announce(`Opened ${current().name}.`);
  }
  function closeThread() {
    const id = state.thread;
    state.thread = null;
    render();
    focus(`reply-${id}`);
  }
  function toggleNavigation() {
    state.navigationOpen = !state.navigationOpen;
    syncVisibility();
    focus(state.navigationOpen ? "search" : "switch-conversations");
  }
  function back() {
    if (state.thread) { closeThread(); return; }
    if (variant === "focus") { toggleNavigation(); return; }
    state.reading = false;
    state.mobileReading = false;
    render();
    focus(`nav-${state.selected}`);
  }
  function schedule(message, outcome) {
    const handle = setTimeout(() => {
      timers.delete(message.id);
      message.status = outcome;
      const restoreComposer = ["conversation-title", "thread-title"].includes(document.activeElement.id);
      render();
      if (restoreComposer && message.conversationId === state.selected && message.threadId === state.thread) {
        focus(message.threadId ? "reply-input" : "message-input");
      }
      announce(outcome === "sent" ? "Message sent in the demo." : outcome === "rejected" ? "Demo message rejected. Use Retry to make another attempt." : "Demo delivery is unknown. Check the original send's status instead of resending.");
    }, 700);
    timers.set(message.id, handle);
  }
  function consumeOutcome() {
    const outcome = state.nextOutcome;
    state.nextOutcome = "sent";
    updateControls();
    return outcome;
  }
  function submit(form) {
    const isReply = form.dataset.reply === "true";
    const key = draftKey(isReply);
    const text = (state.drafts.get(key) || "").trim();
    if (!text || blocked(isReply)) {
      announce(!text ? "Write a message before sending." : !state.online ? "Reconnect the demo before sending. Your draft is kept." : "This composer isn't ready to send yet.");
      return;
    }
    const message = {
      id: `demo-${++state.sequence}`, author: "Alex Morgan", time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false }),
      text, status: "pending", conversationId: state.selected, threadId: isReply ? state.thread : null,
      ...(current().kind === "channel" && !isReply ? { replies: [] } : {})
    };
    if (isReply) {
      parent().replies.push(message);
    } else {
      current().messages.push(message);
    }
    state.drafts.delete(key);
    const outcome = consumeOutcome();
    render(true);
    // Keep keyboard focus available while the composer is briefly disabled.
    focus(isReply ? "thread-title" : "conversation-title");
    announce("Sending a demo message.");
    schedule(message, outcome);
  }
  function findMessage(id) {
    for (const item of data) {
      for (const message of item.messages) {
        if (message.id === id) return message;
        const reply = message.replies?.find(entry => entry.id === id);
        if (reply) return reply;
      }
    }
  }
  function changeConnection() {
    state.online = !state.online;
    if (!state.online) {
      timers.forEach((handle, id) => {
        clearTimeout(handle);
        findMessage(id).status = "unknown";
      });
      timers.clear();
    }
    updateControls();
    render();
    announce(state.online ? "Demo reconnected. Uncertain messages have not been resent." : "Offline demo. Nothing will be queued or automatically resent.");
  }
  function updateTheme() {
    const theme = document.documentElement.dataset.theme;
    const target = theme === "dark" ? "light" : "dark";
    const control = document.getElementById("theme-toggle");
    control.innerHTML = `${icon(target === "dark" ? "moon" : "sun")}<span>${target === "dark" ? "Dark" : "Light"}</span>`;
    control.setAttribute("aria-label", `Switch to ${target} theme`);
    document.querySelectorAll("[data-local-link]").forEach(link => {
      const url = new URL(link.getAttribute("href"), location.href);
      const explicitTheme = new URLSearchParams(location.search).get("clawpilotTheme");
      if (explicitTheme === "light" || explicitTheme === "dark") url.searchParams.set("clawpilotTheme", explicitTheme);
      link.href = url.href;
    });
  }
  document.addEventListener("click", event => {
    const control = event.target.closest("[data-action]");
    if (!control || control.disabled) return;
    const action = control.dataset.action;
    if (action === "select") selectConversation(control.dataset.id);
    else if (action === "filter") { state.filter = control.dataset.value; renderNavigation(); }
    else if (action === "clear-search") {
      state.query = ""; state.filter = "all"; document.getElementById("search").value = ""; renderNavigation(); focus("search");
    } else if (action === "toggle-navigation") toggleNavigation();
    else if (action === "back") back();
    else if (action === "open-thread") {
      if (state.thread === control.dataset.message) { closeThread(); return; }
      state.thread = control.dataset.message; render(); focus("thread-title");
      announce("Opened thread.");
    } else if (action === "close-thread") closeThread();
    else if (action === "restore-view") {
      state.view = "normal"; updateControls(); render(); focus("conversation-title"); announce("Sample messages restored.");
    } else if (action === "focus-composer") focus("message-input");
    else if (action === "connection") changeConnection();
    else if (action === "retry" || action === "check-status") {
      if (!state.online || state.view !== "normal") return;
      const message = findMessage(control.dataset.message);
      if (action === "retry" && message?.status === "rejected") {
        message.status = "pending"; const outcome = consumeOutcome(); render(); schedule(message, outcome); announce("Retrying a definitively rejected demo message.");
      } else if (action === "check-status" && message?.status === "unknown") {
        message.status = "checking"; render(); schedule(message, "sent"); announce("Checking the original demo send. No new message is being sent.");
      }
    } else if (action === "reset") {
      timers.forEach(clearTimeout); timers.clear(); data = fixtures(); state = initialState();
      buildNavigation(); render(current().kind === "channel" ? "start" : true); updateControls(); menu.open = false; document.querySelector("#demo-menu summary").focus(); announce("Demo reset. All sample messages and settings restored.");
    } else if (action === "theme") {
      const target = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = target;
      const url = new URL(location.href); url.searchParams.set("clawpilotTheme", target);
      history.replaceState(null, "", url); updateTheme();
    }
  });
  document.addEventListener("input", event => {
    if (event.target.id === "search") { state.query = event.target.value; renderNavigation(); }
    else if (event.target.matches("textarea[data-draft-key]")) {
      state.drafts.set(event.target.dataset.draftKey, event.target.value);
      event.target.form.querySelector("button[type='submit']").disabled = !event.target.value.trim() || blocked(event.target.form.dataset.reply === "true");
    }
  });
  document.addEventListener("submit", event => {
    if (!event.target.matches(".composer")) return;
    event.preventDefault(); submit(event.target);
  });
  document.addEventListener("change", event => {
    if (event.target.id === "view-state") {
      state.view = event.target.value; state.thread = null; render();
      announce(state.view === "normal" ? "Normal demo view restored." : `${state.view} view simulated. Use the demo control or recovery button to restore messages.`);
    } else if (event.target.id === "send-outcome") {
      state.nextOutcome = event.target.value;
      announce(`Next demo send will be ${state.nextOutcome}.`);
    }
  });
  navigation.addEventListener("toggle", event => {
    if (event.target.matches(".team-group")) state.groups[event.target.dataset.team] = event.target.open;
  }, true);
  document.addEventListener("keydown", event => {
    if (event.target.matches("textarea") && event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
      event.preventDefault(); submit(event.target.form); return;
    }
    if (event.key === "Escape") {
      if (menu.open) { menu.open = false; document.querySelector("#demo-menu summary").focus(); }
      else if (state.navigationOpen) toggleNavigation();
      else if (state.thread) closeThread();
      else if ((variant === "inbox" && state.reading) || (matchMedia("(max-width: 720px)").matches && state.mobileReading)) back();
    }
    if (event.key === "Tab" && variant === "focus" && state.navigationOpen) {
      const controls = [...navigation.querySelectorAll("button, input, summary")].filter(element => !element.disabled && element.getClientRects().length);
      const first = controls[0], last = controls.at(-1);
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
  });
  document.addEventListener("pointerdown", event => {
    if (menu.open && !menu.contains(event.target)) menu.open = false;
  });
  const requestedTheme = new URLSearchParams(location.search).get("clawpilotTheme");
  if (requestedTheme !== "light" && requestedTheme !== "dark") {
    document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  buildNavigation();
  updateControls();
  render(current().kind === "channel" ? "start" : true);
})();

  </script>
