<!doctype html>
<html lang="en">
<!--
THESIS: Reach an available chat deliberately, without leaving Split View.
OWN-WORLD: Segoe UI, Clawpilot neutral surfaces, restrained rose accent, subtle borders.
STORY: Search authorized chat titles, verify the destination, then write with explicit delivery outcomes.
FIRST VIEWPORT: Recent conversations and New chat on the left; chat search and available chats on the right.
FORM: User-selected New chat extension, capability-aware existing chats, contextual threads, single-task mobile surfaces.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A Teams-backed messaging reference application. Dev workspace uses synthetic data." />
  <title>Conversations - Teams reference</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
